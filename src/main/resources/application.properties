spring.application.name=todos
server.port=${PORT:8080}

# En local, las variables salen del archivo .env (ignorado por git).
# En Render, el archivo no existe y se usan las variables de entorno del servicio.
spring.config.import=optional:file:.env[.properties]

# Base de datos: PostgreSQL en Supabase (los valores nunca van en este archivo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo crean las migraciones de supabase/migrations/; Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Orígenes permitidos por CORS (separados por coma). Nunca "*".
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# Usuario que puede crear, editar y eliminar. Sin valores por defecto:
# si faltan, la app no arranca (nunca hay una contraseña por defecto).
app.security.user=${APP_USER:}
app.security.password=${APP_PASSWORD:}

# Render termina HTTPS en su proxy; así Spring sabe que la petición original fue HTTPS
server.forward-headers-strategy=framework

# Los errores nunca exponen detalles internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
